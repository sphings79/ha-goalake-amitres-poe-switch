name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt pytest-homeassistant-custom-component
      - run: scripts/test.sh
